{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-md-7"><div class="card p-4"><h2 class="mb-3">Login / Register</h2><div class="row g-4"><div class="col-md-6"><h5>Login</h5><form method="post" action="/login"><input class="form-control mb-2" name="email" placeholder="Email" required><input class="form-control mb-3" name="password" type="password" placeholder="Password" required><button class="btn btn-primary w-100">Login</button></form><hr><p class="small-muted mb-1">Demo accounts</p><small>Customer: customer@parkify.com / 1234<br>Owner: owner@parkify.com / 1234<br>Admin: admin@parkify.com / 1234</small></div><div class="col-md-6"><h5>New user</h5><form method="post" action="/register"><input class="form-control mb-2" name="name" placeholder="Full name" required><input class="form-control mb-2" name="email" type="email" placeholder="Email" required><input class="form-control mb-2" name="password" placeholder="Password" required><select class="form-select mb-3" name="role"><option value="customer">Customer</option><option value="owner">Parking Owner</option></select><button class="btn btn-success w-100">Create Account</button></form></div></div></div></div></div>{% endblock %}
